# Netlify: la page du concert est servie directement sur https://choristes-tanger.netlify.app
[build]
  command = "bash build-site.sh https://choristes-tanger.netlify.app"
  publish = "site"

# Les anciens liens en /december2026 renvoient vers la page d'accueil
[[redirects]]
  from = "/december2026/*"
  to = "/:splat"
  status = 301
